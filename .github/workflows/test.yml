name: test

# Every check of a change, in one workflow (`test / context` decides the tier):
#
#   fast  a feature-branch push to MolCrafts: pytest on Python 3.12.
#   full  every push to a fork (proven before its pull request), dev, master
#         and main on MolCrafts, pull requests, tags and dispatches: pytest on
#         3.12 and 3.13.
#
# hooks, ty, docs and workflows run the same in every tier. `test / result`
# is the one check branch rules require.
#
# Linux only: the extension builds against CPU torch on Linux runners.
# tests/ holds unit tests only; regressions/ and benchmarks/ are scripts and
# are not in CI.
'on':
  push:
    branches:
    - '**'
  pull_request:
    branches:
    - dev
    - master
    - main
  workflow_dispatch: null

permissions:
  contents: read

# One group per file, workflow, event and ref; only a feature ref cancels its
# superseded runs. The canonical block: actions/check-workflows.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci context.yml.
  context:
    permissions:
      contents: read
    name: test
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76

  python:
    name: test / python (${{ matrix.python }})
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.context.outputs.tier == 'full' && '["3.12","3.13"]' || '["3.12"]') }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
        with:
          python-version: ${{ matrix.python }}
      - uses: ./.github/actions/setup-molnex
      - run: pytest tests/ -q -p no:cacheprovider -n auto --dist worksteal

  # The commit-stage hooks of .pre-commit-config.yaml (hygiene + ruff) on
  # every file.
  hooks:
    name: test / hooks
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
      # The ci-lint hook calls the ruff on PATH (language: system).
      - run: uv tool install ruff
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  # ty resolves torch & co. from the environment, so this job installs the
  # dependencies (not the extension). Every rule pyproject.toml downgrades
  # stays a warning; an error-level diagnostic fails.
  ty:
    name: test / ty
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
      - uses: ./.github/actions/setup-molnex
        with:
          build: "false"
      - run: ty check src/ --exit-zero-on-warning

  # The site as Cloudflare Pages builds it, --strict: any warning fails.
  # Cloudflare Pages deploys it from MolCrafts itself, so no job here deploys.
  # mkdocstrings reads src/ statically, so the docs extra is all it needs; the
  # requirements below are pyproject.toml's `docs` extra.
  docs:
    name: test / docs
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
      - run: >-
          uvx --from "zensical>=0.0.51"
          --with "molcrafts-zensical-theme>=0.2.3" --with "mkdocstrings[python]>=0.30"
          zensical build --strict

  workflow-policy:
    name: test / workflows
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/check-workflows@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76

  result:
    name: test / result
    needs: [context, python, hooks, ty, docs, workflow-policy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; . == "success" or . == "skipped")'
