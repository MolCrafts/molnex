name: docs

# The site as Cloudflare Pages builds it, --strict: any warning fails.
# Cloudflare Pages deploys it from MolCrafts itself, so no job here deploys.
# mkdocstrings reads src/ statically, so the docs extra is all it needs; the
# requirements below are pyproject.toml's `docs` extra.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

permissions:
  contents: read

# One group per file, workflow, event and ref; only a feature ref cancels its
# superseded runs. The canonical block: actions/check-workflows.
concurrency:
  group: docs-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master","refs/heads/main"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci/actions/ci-context.
  context:
    name: docs / context
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.context.outputs.tier }}
      upstream: ${{ steps.context.outputs.upstream }}
      integration: ${{ steps.context.outputs.integration }}
      skip-pr: ${{ steps.context.outputs.skip-pr }}
      publish: ${{ steps.context.outputs.publish }}
    steps:
      - id: context
        uses: MolCrafts/molcrafts-ci/actions/ci-context@master

  build:
    name: docs / build
    needs: context
    # A pull request inside a fork was already run by its push.
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@master
      - run: >-
          uvx --from "zensical>=0.0.51"
          --with "molcrafts-zensical-theme>=0.2.3" --with "mkdocstrings[python]>=0.30"
          zensical build --strict
