name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Install build prerequisites
        run: |
          python -m pip install --upgrade pip
          pip install "scikit-build-core>=0.10" "cmake>=4" ninja
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.10"
      - name: Install project
        run: |
          export CMAKE_PREFIX_PATH="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')"
          pip install -e ".[dev]" --no-build-isolation -v
        timeout-minutes: 20
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - name: Type check
        # BLOCKING at error severity (0 errors as of 2026-08-30). The warn
        # tier is the rule-scoped debt in [tool.ty.rules] (pyproject.toml),
        # each rule downgraded with a named third-party-stub rationale —
        # those still print here; a new error-severity diagnostic fails CI.
        run: ty check src/ --exit-zero-on-warning

  test:
    name: Test (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build prerequisites
        run: |
          python -m pip install --upgrade pip
          pip install "scikit-build-core>=0.10" "cmake>=4" ninja
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.10"
      - name: Install project
        run: |
          export CMAKE_PREFIX_PATH="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')"
          pip install -e ".[dev]" --no-build-isolation -v
        timeout-minutes: 20
      - name: Run tests
        run: pytest tests/ -q -p no:cacheprovider -n auto --dist worksteal

  interface:
    name: Interface (C++, no LAMMPS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build prerequisites
        run: |
          python -m pip install --upgrade pip
          pip install "scikit-build-core>=0.10" "cmake>=4" ninja
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.10"
      - name: Install project
        run: |
          export CMAKE_PREFIX_PATH="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')"
          pip install -e ".[dev]" --no-build-isolation -v
        timeout-minutes: 20
      - name: Check C++ formatting (interface/.clang-format)
        # Pinned to the version the tree was formatted with — wrap decisions
        # drift across clang-format majors and would false-fail this gate.
        run: |
          pip install "clang-format==22.1.*"
          find interface \( -name '*.cpp' -o -name '*.h' \) \
            | xargs clang-format --dry-run --Werror
      - name: Configure and build interface (no LAMMPS)
        run: |
          export CMAKE_PREFIX_PATH="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')"
          cmake -S interface -B build/interface -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/interface -j
      # Every case except the ones this runner cannot run, removed BY FILTER
      # rather than left to report a runtime [skip] (a skip that always passes
      # is not a gate): cuda_run_matches_reference needs a GPU, and
      # parity_classical_* drive a real `lmp`. The fixture cases pull in
      # fixture_setup, which packages two toy models on CPU through
      # molix.export.aoti — the deployment path itself, so the C++ readers are
      # tested against the Python writer.
      - name: Run interface ctests (all but CUDA and LAMMPS-driven)
        run: |
          ctest --test-dir build/interface \
            -E '^cuda_run_matches_reference$|^parity_classical_' \
            --output-on-failure
