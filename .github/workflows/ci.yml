name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Install build prerequisites
        run: |
          python -m pip install --upgrade pip
          pip install "scikit-build-core>=0.10" "cmake>=4" ninja
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.10"
      - name: Install project
        run: |
          export CMAKE_PREFIX_PATH="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')"
          pip install -e ".[dev]" --no-build-isolation -v
        timeout-minutes: 20
      # format --check deferred until tree is fully formatted
      - run: ruff check src/ tests/
      - name: Type check
        run: ty check src/
        continue-on-error: true

  test:
    name: Test (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build prerequisites
        run: |
          python -m pip install --upgrade pip
          pip install "scikit-build-core>=0.10" "cmake>=4" ninja
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.10"
      - name: Install project
        run: |
          export CMAKE_PREFIX_PATH="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')"
          pip install -e ".[dev]" --no-build-isolation -v
        timeout-minutes: 20
      - name: Run tests
        run: pytest tests/ -q -p no:cacheprovider
        continue-on-error: true
