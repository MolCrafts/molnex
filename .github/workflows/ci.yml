name: CI

# Lint/test gates use tox (pyproject [tool.tox]); torch CPU wheel for stock runners.

on:
  push:
    branches:
      - master
      - dev
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: uv run --extra dev tox -e lint
        run: uv run --extra dev tox -e lint

  test:
    name: Test (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Install build prerequisites (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install "scikit-build-core>=0.10" "cmake>=4" ninja
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.10"
      - name: uv run --extra dev tox -e py
        run: |
          export CMAKE_PREFIX_PATH="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')"
          uv run --extra dev tox -e py
        timeout-minutes: 30
        continue-on-error: true
