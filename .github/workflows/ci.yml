name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Install build prerequisites
        run: |
          python -m pip install --upgrade pip
          pip install "scikit-build-core>=0.10" "cmake>=4" ninja
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.10"
      - name: Install project
        run: |
          export CMAKE_PREFIX_PATH="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')"
          pip install -e ".[dev]" --no-build-isolation -v
        timeout-minutes: 20
      - run: ruff check src/ tests/ scripts/ regressions/
      - run: ruff format --check src/ tests/ scripts/ regressions/
      - name: Type check
        # Advisory until the ~460 pre-existing ty diagnostics under src/ are
        # burned down; do not add new ones (reviewers read this log).
        run: ty check src/
        continue-on-error: true

  test:
    name: Test (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build prerequisites
        run: |
          python -m pip install --upgrade pip
          pip install "scikit-build-core>=0.10" "cmake>=4" ninja
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.10"
      - name: Install project
        run: |
          export CMAKE_PREFIX_PATH="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')"
          pip install -e ".[dev]" --no-build-isolation -v
        timeout-minutes: 20
      - name: Run tests
        run: pytest tests/ -q -p no:cacheprovider -n auto --dist worksteal

  interface:
    name: Interface (C++, no LAMMPS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build prerequisites
        run: |
          python -m pip install --upgrade pip
          pip install "scikit-build-core>=0.10" "cmake>=4" ninja
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.10"
      - name: Install project
        run: |
          export CMAKE_PREFIX_PATH="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')"
          pip install -e ".[dev]" --no-build-isolation -v
        timeout-minutes: 20
      - name: Check C++ formatting (interface/.clang-format)
        # Pinned to the version the tree was formatted with — wrap decisions
        # drift across clang-format majors and would false-fail this gate.
        run: |
          pip install "clang-format==22.1.*"
          find interface \( -name '*.cpp' -o -name '*.h' \) \
            | xargs clang-format --dry-run --Werror
      - name: Configure and build interface (no LAMMPS)
        run: |
          export CMAKE_PREFIX_PATH="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')"
          cmake -S interface -B build-interface -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-interface -j
      # Explicit filter, never bare ctest: the FIXTURES_SETUP entry would run a
      # full Python AOTI export; only the no-fixture list plus the CPU-safe
      # fixture-backed cases belong in this gate.
      #
      # -R selects the meta / contract / bridge / impl / registry families. That sweeps in
      # bridge_dynamic_exec_matches_reference, which is wanted: it is the only
      # numerical parity evidence for the Exec extraction, its graph-potential
      # fixture exports on CPU, and ctest pulls fixture_setup in automatically
      # because that case declares FIXTURES_REQUIRED.
      #
      # -E then removes the CUDA-gated case BY FILTER rather than letting it
      # report a runtime [skip]. A skip that always passes is not a gate, and a
      # green tick against a case that never ran is the failure mode this
      # exclusion exists to prevent. (cuda_run_matches_reference needs no entry
      # here — it does not match -R in the first place.)
      - name: Run interface ctests (no-fixture list + CPU parity case)
        run: |
          ctest --test-dir build-interface \
            -R '^meta_|^contract_|^bridge_|^impl_|^registry_' \
            -E '^bridge_graphed_exec_matches_dynamic$' \
            --output-on-failure
