# Managed by prek: `prek install`
# CI parity: lint.yml runs the pre-commit stage of this file; test.yml runs
# the ci-test command (no tox wrapper).
# tox remains in [project.optional-dependencies] dev for optional local isolation.

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-toml
      - id: check-json

  - repo: local
    hooks:
      - id: ci-lint
        name: "CI lint (lint.yml)"
        entry: bash -c 'ruff check src/ tests/'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: ci-test
        name: "CI test (test.yml)"
        entry: bash -c 'pytest tests/ -q -p no:cacheprovider -n auto --dist worksteal'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
