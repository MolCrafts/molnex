[project]
site_name = "MolNex Documentation"
site_description = "Dict-first molecular ML framework"
site_url = "https://docs.molcrafts.org/molnex/"
repo_url = "https://github.com/molcrafts/molnex"
repo_name = "molcrafts/molnex"
edit_uri = "edit/main/docs"
docs_dir = "docs"
site_dir = "site"
extra_javascript = [
    "javascripts/mathjax.js",
    { path = "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js", async = true },
]

nav = [
    { "Home" = "index.md" },
    { "Installation" = "installation.md" },
    { "Molix" = [
        { "Overview" = "molix/index.md" },
        { "Tutorials" = [
            { "Quick Start" = "molix/tutorials/quick-start.md" },
            { "Train a Graph Model" = "molix/tutorials/train-a-graph-model.md" }
        ]},
        { "User Guide" = [
            { "Trainer" = "molix/user-guide/trainer.md" },
            { "Hooks" = "molix/user-guide/hooks.md" },
            { "Data Pipeline" = "molix/user-guide/data.md" },
            { "Data Loading" = "molix/user-guide/data-loading.md" },
            { "Data Modules" = "molix/user-guide/data-modules.md" },
            { "Molecular Dynamics" = "molix/user-guide/md.md" },
            { "Profiling" = "molix/user-guide/profiling.md" }
        ]},
        { "Explanation" = [
            { "Execution Model" = "molix/explanation/execution-model.md" },
            { "Batch Schema" = "molix/explanation/batch-schema.md" },
            { "Training Throughput & torch.compile" = "molix/explanation/throughput-and-compilation.md" }
        ]}
    ]},
    { "MolRep" = [
        { "Overview" = "molrep/index.md" },
        { "Tutorials" = [
            { "Build an Encoder" = "molrep/tutorials/build-an-encoder.md" }
        ]},
        { "User Guide" = [
            { "Encoders" = "molrep/user-guide/encoders.md" },
            { "Embeddings" = "molrep/user-guide/embeddings.md" }
        ]},
        { "Explanation" = [
            { "Representation Learning" = "molrep/explanation/representation-learning.md" }
        ]}
    ]},
    { "MolPot" = [
        { "Overview" = "molpot/index.md" },
        { "Tutorials" = [
            { "Build a Potential" = "molpot/tutorials/build-a-potential.md" }
        ]},
        { "User Guide" = [
            { "Components" = "molpot/user-guide/components.md" },
            { "Gradients and Forces" = "molpot/user-guide/gradients.md" }
        ]},
        { "Explanation" = [
            { "Potential Composition" = "molpot/explanation/potential-composition.md" }
        ]}
    ]},
    { "MolZoo" = [
        { "Overview" = "molzoo/index.md" },
        { "Tutorial" = "molzoo/tutorials/index.md" },
        { "User Guide" = [
            { "Allegro" = "molzoo/user-guide/allegro.md" }
        ]},
        { "Spec" = [
            { "Allegro Spec" = "molzoo/specs/allegro.md" },
            { "MACEOMol Spec" = "molzoo/specs/mace_omol.md" }
        ]}
    ]},
    { "API Reference" = [
        { "Overview" = "api/index.md" },
        { "molix" = "api/molix.md" },
        { "molrep" = "api/molrep.md" },
        { "molpot" = "api/molpot.md" },
        { "molzoo" = "api/molzoo.md" }
    ]}
]

# Shared MolCrafts theme: brand palette, light/dark schemes, navigation
# features, and fonts. Do not re-list features/palette/fonts here.
[project.theme]
name = "molcrafts"
language = "en"

[project.extra.molcrafts]
product = "molnex"
accent = "#db2777"                        # primary — molnex signature colour
accent_soft = "rgba(219, 39, 119, 0.14)"  # secondary — soft fill behind it

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/MolCrafts/molnex"

# Markdown: keep arithmatex for MathJax; other defaults come from Zensical.
[project.markdown_extensions."pymdownx.arithmatex"]
generic = true

[project.plugins.search]
enabled = true

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
show_signature_annotations = true
show_root_heading = true
show_root_full_path = false
members_order = "source"
